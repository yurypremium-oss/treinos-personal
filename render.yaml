services:
  - type: web
    name: treinos-personal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /tmp/treinos-data
      - key: GITHUB_REPOSITORY
        value: yurypremium-oss/treinos-personal
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
